{% extends 'admin_base.html' %}{% block title %}Create Tender | GreenTender{% endblock %}{% block page_title %}Create New Tender{% endblock %}{% block page_subtitle %}Publish a plantation requirement to verified nurseries.{% endblock %}{% block content %}
<div class="card"><form method="post"><div class="form-row"><label>Title</label><input name="title" required maxlength="200"></div><div class="form-row"><label>Description</label><textarea name="description" required></textarea></div><div class="form-grid"><div class="form-row"><label>Location</label><input name="location" required></div><div class="form-row"><label>Road Name</label><input name="road_name" required></div><div class="form-row"><label>Plant Type</label><input name="plant_type" required></div><div class="form-row"><label>Quantity Required</label><input type="number" name="quantity_required" min="1" required></div><div class="form-row"><label>Estimated Budget (₹)</label><input type="number" name="estimated_budget" min="1" step="0.01" required></div><div class="form-row"><label>Publish Date</label><input type="date" name="publish_date" required></div><div class="form-row"><label>Closing Date</label><input type="date" name="closing_date" required></div></div><button class="btn" type="submit"><i class="bi bi-megaphone"></i> Publish Tender</button> <a class="btn secondary" href="{{ url_for('admin.tenders') }}">Cancel</a></form></div>
{% endblock %}
